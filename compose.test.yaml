services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: test/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SINGLE_BEAT_REDIS_SERVER: redis://redis:6379/9
    command: ["python", "-m", "unittest", "discover", "-s", "test", "-p", "test_cli_integration.py", "-v"]
